<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background with subtle border -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="url(#grad-cyan)" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Film / Video Camera Body -->
  <rect x="12" y="19" width="28" height="26" rx="6" fill="url(#grad-gold)" filter="url(#glow)"/>
  
  <!-- Camera Lens / Projector Cone -->
  <path d="M42 27L52 21V43L42 37V27Z" fill="url(#grad-gold)"/>
  
  <!-- AI Sparkle / Star at top right of camera -->
  <path d="M26 25L27.5 29.5L32 31L27.5 32.5L26 37L24.5 32.5L20 31L24.5 29.5L26 25Z" fill="#0F172A"/>
  
  <!-- Cyan Accent Dot -->
  <circle cx="48" cy="24" r="2.5" fill="url(#grad-cyan)"/>
</svg>
